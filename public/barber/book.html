<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book — Crispin Cuts</title>
<meta name="description" content="Classic cuts, by appointment. Book online.">
<meta name="theme-color" content="#2b2f34">
<style>
/* ── Crispin Cuts ────────────────────────────────────────────────────────
   Light charcoal, chrome rules, a serif that remembers 1994. Nothing moves
   on this page except the pole, which is the only thing that should. */
:root{
  --ink:#22262b; --ink-2:#3a4047; --grey:#6f7780; --line:#d3d7db;
  --canvas:#dcdfe2; --panel:#f7f8f9; --card:#fff;
  --red:#b8202e; --blue:#1e4b8f; --gold:#a8873f;
  --shadow:0 1px 2px rgba(24,28,32,.08), 0 8px 28px rgba(24,28,32,.10);
  --serif:Georgia,'Times New Roman',Times,serif;
  --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 16px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 20% -10%,#e7eaec 0,transparent 55%)}
a{color:var(--ink)}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:.02em;margin:0}

/* ── The rail: pole + name, fixed down the left on a wide screen ───────── */
.rail{position:fixed;left:0;top:0;bottom:0;width:132px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:28px;background:linear-gradient(180deg,#31363c,#22262b);
  border-right:1px solid #14171a;z-index:20}
.rail::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.25),transparent)}
.railname{font-family:var(--serif);font-weight:700;font-size:23px;letter-spacing:.36em;text-transform:uppercase;
  color:#f2f4f5;writing-mode:vertical-rl;transform:rotate(180deg);
  text-shadow:0 0 18px rgba(255,255,255,.35),0 0 42px rgba(184,32,46,.35)}
.railest{writing-mode:vertical-rl;transform:rotate(180deg);color:#8d959d;font:500 10px/1 var(--sans);letter-spacing:.42em;text-transform:uppercase}

/* ── The pole. Stripes climb; the cylinder is shading, not an image. ───── */
.pole{width:46px;position:relative;filter:drop-shadow(0 0 16px rgba(255,255,255,.22))}
.cap{height:15px;border-radius:3px;background:linear-gradient(180deg,#f0f2f3,#b9bfc5 45%,#7d848b 55%,#e3e7ea);
  border:1px solid #5f666d;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.finial{width:26px;height:26px;margin:0 auto 4px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff,#c6ccd1 45%,#767d84 78%,#3d4349);
  box-shadow:0 0 16px rgba(255,255,255,.5)}
.foot{width:26px;height:22px;margin:4px auto 0;border-radius:0 0 13px 13px;
  background:radial-gradient(circle at 34% 20%,#fff,#c6ccd1 45%,#767d84 78%,#3d4349)}
.tube{height:168px;overflow:hidden;position:relative;border-left:1px solid #6b7178;border-right:1px solid #6b7178;
  background:repeating-linear-gradient(-58deg,
    var(--red) 0 13px,#fff 13px 26px,var(--blue) 26px 39px,#fff 39px 52px);
  background-size:auto 52px;animation:climb 2.6s linear infinite;
  box-shadow:0 0 26px rgba(232,236,239,.45)}
/* Curvature: dark at the edges, a highlight a third of the way in. */
.tube::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,.05) 22%,rgba(255,255,255,.55) 34%,
    rgba(255,255,255,.05) 46%,rgba(0,0,0,.10) 72%,rgba(0,0,0,.45))}
@keyframes climb{from{background-position:0 0}to{background-position:0 -52px}}
.glass{position:absolute;inset:-8px;border-radius:24px;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.20),transparent 70%);
  animation:pulse 3.4s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.tube,.glass{animation:none}}

/* ── Page ─────────────────────────────────────────────────────────────── */
.wrap{margin-left:132px;padding:0 24px 96px}
.inner{max-width:760px;margin:0 auto}
header.masthead{padding:56px 0 28px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.kicker{font:500 11px/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--grey);margin-bottom:14px}
h1.shop{font-size:44px;line-height:1.05;letter-spacing:.04em;text-transform:uppercase}
.tagline{margin:14px 0 0;color:var(--ink-2);font-family:var(--serif);font-style:italic;font-size:18px}
.meta{margin-top:18px;color:var(--grey);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 18px}
.barberrule{height:5px;margin:0 0 34px;
  background:linear-gradient(90deg,var(--red) 0 33.3%,#fff 33.3% 66.6%,var(--blue) 66.6% 100%);
  border-bottom:1px solid var(--line)}

.step{margin-bottom:40px}
.steplabel{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.num{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--ink);color:#fff;
  font:600 12px/26px var(--sans);text-align:center}
h2.stepname{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-family:var(--sans);font-weight:600}

.cards{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);padding:18px 20px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:16px;box-shadow:var(--shadow);
  transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--ink)}
.card[aria-selected="true"]{border-color:var(--ink);border-left:4px solid var(--red);background:#fff}
.card h3{font-size:19px}
.card>div:last-child{flex:0 0 auto}
.card p{margin:5px 0 0;color:var(--grey);font-size:14px}
.price{font-family:var(--serif);font-size:22px;white-space:nowrap;text-align:right}
.dur{display:block;color:var(--grey);font:500 11px/1.6 var(--sans);letter-spacing:.14em;text-transform:uppercase;text-align:right;white-space:nowrap}

.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.day{flex:0 0 auto;min-width:74px;background:var(--card);border:1px solid var(--line);padding:12px 10px;
  text-align:center;cursor:pointer;box-shadow:var(--shadow)}
.day small{display:block;font:500 10px/1.6 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
.day b{display:block;font-family:var(--serif);font-size:21px;margin-top:2px}
.day[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.day[aria-selected="true"] small{color:#b6bec6}
.day[disabled]{opacity:.34;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:16px}
.slot{background:var(--card);border:1px solid var(--line);padding:12px 6px;font:500 14px var(--sans);
  cursor:pointer;box-shadow:var(--shadow)}
.slot:hover{border-color:var(--ink)}
.slot[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

form{background:var(--card);border:1px solid var(--line);padding:24px;box-shadow:var(--shadow)}
label{display:block;font:600 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--grey);margin:0 0 7px}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);background:#fcfcfd;font:400 16px var(--sans);color:var(--ink);border-radius:0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.field{margin-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
button.go{width:100%;padding:16px;background:var(--ink);color:#fff;border:0;cursor:pointer;
  font:600 13px var(--sans);letter-spacing:.2em;text-transform:uppercase}
button.go:hover{background:#000}
button.go[disabled]{opacity:.4;cursor:not-allowed}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink-2);padding:12px 18px;cursor:pointer;
  font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase}
button.ghost:hover{border-color:var(--ink)}

.summary{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);padding:16px 18px;margin-bottom:22px;font-size:15px}
.summary b{font-family:var(--serif);font-size:17px}
.note{color:var(--grey);font-size:13px;margin-top:12px}
.err{background:#fdf2f3;border:1px solid #e6b8bd;border-left:4px solid var(--red);color:#8c1620;padding:12px 14px;margin-bottom:16px;font-size:14px}
.ok{background:#f2f7f2;border:1px solid #bcd4bc;border-left:4px solid #2e6b34;color:#1f4a24;padding:12px 14px;margin-bottom:16px;font-size:14px}
.receipt{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:34px}
.receipt h2{font-size:30px;letter-spacing:.02em}
.rows{width:100%;border-collapse:collapse;margin:22px 0}
.rows td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top}
.rows td:first-child{width:38%;color:var(--grey);font:600 11px/1.5 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.rows td:last-child{font-family:var(--serif);font-size:16px}
.muted{color:var(--grey);font-size:13px}
footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);color:var(--grey);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hide{display:none!important}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:820px){
  /* The pole lies down rather than being scaled: shrinking the parts keeps it
     inside the bar, where a transform left it hanging over the headline. */
  .rail{position:static;width:auto;height:auto;flex-direction:row;align-items:center;gap:14px;justify-content:flex-start;padding:11px 18px}
  .railname{writing-mode:horizontal-tb;transform:none;font-size:18px;letter-spacing:.26em}
  .railest{display:none}
  .pole{width:22px;filter:drop-shadow(0 0 10px rgba(255,255,255,.25))}
  .pole .tube{height:46px;box-shadow:0 0 14px rgba(232,236,239,.4)}
  .pole .finial{width:13px;height:13px;margin-bottom:2px;box-shadow:0 0 9px rgba(255,255,255,.5)}
  .pole .cap{height:7px}
  .pole .foot{width:13px;height:10px;margin-top:2px}
  .glass{inset:-5px}
  .wrap{margin-left:0;padding:0 18px 72px}
  header.masthead{padding:30px 0 22px}
  h1.shop{font-size:32px}
  .two{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="rail" aria-hidden="true">
  <div class="pole">
    <div class="glass"></div>
    <div class="finial"></div>
    <div class="cap"></div>
    <div class="tube"></div>
    <div class="cap"></div>
    <div class="foot"></div>
  </div>
  <div class="railname" id="railName">Crispin Cuts</div>
  <div class="railest">Est. by appointment</div>
</div>

<div class="wrap"><div class="inner">

  <header class="masthead">
    <div class="kicker" id="handleLine">@crispincuts</div>
    <h1 class="shop" id="shopName">Crispin Cuts</h1>
    <p class="tagline" id="tagline"></p>
    <div class="meta" id="meta"></div>
  </header>
  <div class="barberrule"></div>

  <div id="boot" class="muted"><span class="spin"></span> Loading the shop…</div>

  <!-- ── Booking flow ────────────────────────────────────────────────── -->
  <main id="flow" class="hide">
    <section class="step">
      <div class="steplabel"><span class="num">1</span><h2 class="stepname">Choose your service</h2></div>
      <div class="cards" id="services"></div>
    </section>

    <section class="step hide" id="stepDate">
      <div class="steplabel"><span class="num">2</span><h2 class="stepname">Pick a day</h2></div>
      <div class="days" id="days"></div>
      <div id="slotsWrap" class="hide">
        <div class="slots" id="slots"></div>
        <p class="note" id="tzNote"></p>
      </div>
    </section>

    <section class="step hide" id="stepYou">
      <div class="steplabel"><span class="num">3</span><h2 class="stepname">Your details</h2></div>
      <form id="bookForm" autocomplete="on">
        <div class="summary" id="summary"></div>
        <div id="formErr" class="err hide"></div>
        <div class="two">
          <div class="field"><label for="f_name">Name</label><input id="f_name" name="name" required maxlength="80" autocomplete="name"></div>
          <div class="field"><label for="f_phone">Phone (optional)</label><input id="f_phone" name="phone" maxlength="40" autocomplete="tel" inputmode="tel"></div>
        </div>
        <div class="field"><label for="f_email">Email — your confirmation goes here</label>
          <input id="f_email" name="email" type="email" required maxlength="160" autocomplete="email" inputmode="email"></div>
        <div class="field"><label for="f_notes">Anything the barber should know (optional)</label>
          <textarea id="f_notes" name="notes" rows="3" maxlength="500"></textarea></div>
        <button class="go" id="bookBtn" type="submit">Confirm appointment</button>
        <p class="note">You'll get an email with the time. No account, no card needed to book.</p>
      </form>
    </section>
  </main>

  <!-- ── Confirmation / manage ───────────────────────────────────────── -->
  <section id="ticket" class="receipt hide"></section>

  <footer>
    <span id="footShop">Crispin Cuts</span>
    <span>Payments secured by Stripe</span>
  </footer>
</div></div>

<script>
(function(){
  'use strict';
  var API = '/api/v1/barber';

  // The handle IS the address: /@crispincuts. ?h= is the fallback for anywhere
  // the pretty route is not in play.
  var m = location.pathname.match(/^\/@([A-Za-z0-9_.-]+)/);
  var qs = new URLSearchParams(location.search);
  var handle = (m && m[1]) || qs.get('h') || 'crispincuts';

  var shop = null, service = null, day = null, slotISO = null, slotWhen = '', days = [];
  var $ = function(id){ return document.getElementById(id); };
  function show(el,on){ el.classList[on?'remove':'add']('hide'); }
  function usd(c){ return '$' + (Math.max(0,c|0)/100).toFixed(2).replace(/\.00$/,''); }
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

  function api(path, opts){
    return fetch(API + path, Object.assign({ headers:{'Content-Type':'application/json'} }, opts||{}))
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Something went wrong'); return j; }); });
  }

  /* ── Load the shop ─────────────────────────────────────────────────── */
  api('/shops/' + encodeURIComponent(handle)).then(function(j){
    shop = j.shop;
    document.title = 'Book — ' + shop.name;
    $('shopName').textContent = shop.name;
    $('railName').textContent = shop.name;
    $('footShop').textContent = shop.name;
    $('handleLine').textContent = '@' + shop.handle;
    $('tagline').textContent = shop.tagline || '';
    var meta = [];
    if (shop.address) meta.push(esc(shop.address));
    if (shop.phone) meta.push('<a href="tel:'+esc(shop.phone)+'">'+esc(shop.phone)+'</a>');
    meta.push(hoursLine(shop.hours));
    $('meta').innerHTML = meta.join('<span style="color:#b9bfc5">&bull;</span>');
    show($('boot'), false);

    var bid = qs.get('b'), tok = qs.get('t');
    if (bid && tok) return openTicket(bid, tok, qs.get('paid') === '1');
    show($('flow'), true);
    renderServices();
  }).catch(function(e){
    $('boot').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
  });

  function hoursLine(hours){
    var names = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var open = (hours||[]).filter(function(h){ return !h.closed; })
      .map(function(h){ return names[h.day]; });
    return open.length ? esc(open.join(' ')) + ' by appointment' : 'By appointment';
  }

  /* ── Step 1: services ──────────────────────────────────────────────── */
  function renderServices(){
    var box = $('services');
    if (!shop.services.length){ box.innerHTML = '<p class="muted">No services listed yet.</p>'; return; }
    box.innerHTML = shop.services.map(function(s){
      return '<div class="card" role="button" tabindex="0" data-id="'+s.id+'">' +
        '<div><h3>'+esc(s.name)+'</h3>'+(s.description?'<p>'+esc(s.description)+'</p>':'')+'</div>' +
        '<div><div class="price">'+usd(s.priceCents)+'</div><span class="dur">'+s.durationMin+' min</span></div>' +
      '</div>';
    }).join('');
    Array.prototype.forEach.call(box.children, function(el){
      function pick(){ chooseService(el.dataset.id); }
      el.addEventListener('click', pick);
      el.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); pick(); }});
    });
  }

  function chooseService(id){
    service = shop.services.filter(function(s){ return s.id === id; })[0];
    Array.prototype.forEach.call($('services').children, function(el){
      el.setAttribute('aria-selected', el.dataset.id === id ? 'true' : 'false');
    });
    slotISO = null; day = null;
    show($('stepDate'), true); show($('stepYou'), false); show($('slotsWrap'), false);
    loadDays();
    $('stepDate').scrollIntoView({ behavior:'smooth', block:'start' });
  }

  /* ── Step 2: days + times ──────────────────────────────────────────── */
  function loadDays(){
    $('days').innerHTML = '<span class="muted"><span class="spin"></span> Checking the book…</span>';
    api('/shops/'+encodeURIComponent(handle)+'/days?days='+Math.min(shop.horizonDays||21,21)+'&serviceId='+service.id)
      .then(function(j){
        days = j.days;
        $('days').innerHTML = days.map(function(d){
          var parts = d.date.split('-');
          // Rendered from the parts, not from a parsed Date — a browser in
          // Tokyo must still see the shop's Thursday labelled Thursday.
          var dt = new Date(Date.UTC(+parts[0], +parts[1]-1, +parts[2]));
          var wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getUTCDay()];
          var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getUTCMonth()];
          return '<div class="day" role="button" tabindex="0" data-date="'+d.date+'"'+(d.open?'':' disabled')+'>' +
            '<small>'+wd+'</small><b>'+dt.getUTCDate()+'</b><small>'+mo+'</small></div>';
        }).join('');
        Array.prototype.forEach.call($('days').children, function(el){
          if (el.hasAttribute('disabled')) return;
          function pick(){ chooseDay(el.dataset.date); }
          el.addEventListener('click', pick);
          el.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); pick(); }});
        });
        var first = days.filter(function(d){ return d.open; })[0];
        if (first) chooseDay(first.date);
        else $('days').innerHTML = '<p class="muted">Nothing free in the next few weeks — call the shop.</p>';
      }).catch(function(e){ $('days').innerHTML = '<div class="err">'+esc(e.message)+'</div>'; });
  }

  function chooseDay(date){
    day = date;
    Array.prototype.forEach.call($('days').children, function(el){
      el.setAttribute('aria-selected', el.dataset.date === date ? 'true' : 'false');
    });
    show($('slotsWrap'), true);
    $('slots').innerHTML = '<span class="muted"><span class="spin"></span> Loading times…</span>';
    api('/shops/'+encodeURIComponent(handle)+'/availability?date='+date+'&serviceId='+service.id)
      .then(function(j){
        if (!j.slots.length){ $('slots').innerHTML = '<p class="muted">Nothing left on that day.</p>'; return; }
        $('slots').innerHTML = j.slots.map(function(s){
          return '<button type="button" class="slot" data-iso="'+s.start+'" data-label="'+esc(s.label)+'">'+esc(s.label)+'</button>';
        }).join('');
        $('tzNote').textContent = 'Times shown in ' + j.timezone.replace('_',' ') + ' — the shop’s local time.';
        Array.prototype.forEach.call($('slots').children, function(el){
          el.addEventListener('click', function(){ chooseSlot(el.dataset.iso, el.dataset.label); });
        });
      }).catch(function(e){ $('slots').innerHTML = '<div class="err">'+esc(e.message)+'</div>'; });
  }

  function chooseSlot(iso, label){
    slotISO = iso;
    Array.prototype.forEach.call($('slots').children, function(el){
      el.setAttribute('aria-selected', el.dataset.iso === iso ? 'true' : 'false');
    });
    var parts = day.split('-');
    var dt = new Date(Date.UTC(+parts[0], +parts[1]-1, +parts[2]));
    var wd = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dt.getUTCDay()];
    var mo = ['January','February','March','April','May','June','July','August','September','October','November','December'][dt.getUTCMonth()];
    slotWhen = wd + ', ' + mo + ' ' + dt.getUTCDate() + ' at ' + label;
    $('summary').innerHTML = '<b>'+esc(service.name)+'</b> &middot; '+usd(service.priceCents)+' &middot; '+service.durationMin+' min<br>' +
      wd+', '+mo+' '+dt.getUTCDate()+' at <b>'+esc(label)+'</b>';
    show($('stepYou'), true);
    $('stepYou').scrollIntoView({ behavior:'smooth', block:'start' });
  }

  /* ── Step 3: book it ───────────────────────────────────────────────── */
  $('bookForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    if (!service || !slotISO) return;
    var btn = $('bookBtn'); btn.disabled = true; btn.textContent = 'Booking…';
    show($('formErr'), false);
    api('/shops/'+encodeURIComponent(handle)+'/bookings', {
      method:'POST',
      body: JSON.stringify({
        serviceId: service.id, start: slotISO,
        name: $('f_name').value, email: $('f_email').value,
        phone: $('f_phone').value, notes: $('f_notes').value
      })
    }).then(function(j){
      history.replaceState({}, '', '/@'+handle+'?b='+j.booking.id+'&t='+(j.manageUrl.split('t=')[1]||''));
      show($('flow'), false);
      drawTicket(j.booking, j.payUrl, 'Booked. Check your email.', slotWhen);
    }).catch(function(e){
      btn.disabled = false; btn.textContent = 'Confirm appointment';
      $('formErr').textContent = e.message; show($('formErr'), true);
      // A slot lost to someone else has to redraw the grid, or they will keep
      // clicking a time that no longer exists.
      if (/no longer available|just took/i.test(e.message)) chooseDay(day);
    });
  });

  /* ── The client's own copy of their appointment ────────────────────── */
  function openTicket(id, token, justPaid){
    api('/bookings/'+encodeURIComponent(id)+'?t='+encodeURIComponent(token))
      .then(function(j){ drawTicket(j.booking, j.booking.paymentUrl, justPaid ? 'Payment received. Thank you.' : null, j.when, token); })
      .catch(function(e){ show($('flow'), true); renderServices(); });
  }

  function drawTicket(b, payUrl, banner, when, token){
    token = token || (new URLSearchParams(location.search)).get('t');
    when = when || slotWhen;
    var cancelled = b.status === 'cancelled';
    var paid = b.status === 'paid';
    $('ticket').innerHTML =
      (banner ? '<div class="ok">'+esc(banner)+'</div>' : '') +
      '<h2>'+ (cancelled ? 'Cancelled' : 'You&rsquo;re in the book') +'</h2>' +
      '<table class="rows">' +
        '<tr><td>When</td><td><b>'+esc(when)+'</b></td></tr>' +
        '<tr><td>Service</td><td>'+esc(b.serviceName)+' &middot; '+b.durationMin+' min</td></tr>' +
        '<tr><td>Price</td><td>'+usd(b.priceCents)+(paid?' &mdash; paid':'')+'</td></tr>' +
        '<tr><td>Name</td><td>'+esc(b.clientName)+'</td></tr>' +
        (shop.address?'<tr><td>Where</td><td>'+esc(shop.address)+'</td></tr>':'') +
      '</table>' +
      (cancelled
        ? '<a class="go" style="display:block;text-align:center;text-decoration:none" href="/@'+handle+'">Book another time</a>'
        : '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
            (!paid && payUrl ? '<a class="go" style="flex:1;min-width:200px;text-align:center;text-decoration:none;line-height:1.2" href="'+esc(payUrl)+'">Pay '+usd(b.amountDueCents||b.priceCents)+' now</a>' : '') +
            '<button class="ghost" id="cancelBtn">Cancel appointment</button>' +
          '</div>' +
          '<p class="note">Keep this link — it is how you change or cancel. '+(paid?'':'Paying ahead is optional; you can settle in the chair.')+'</p>');
    show($('ticket'), true);
    $('ticket').scrollIntoView({ behavior:'smooth', block:'start' });

    var cb = $('cancelBtn');
    if (cb) cb.addEventListener('click', function(){
      if (!confirm('Cancel this appointment?')) return;
      cb.disabled = true; cb.textContent = 'Cancelling…';
      api('/bookings/'+b.id+'/cancel', { method:'POST', body: JSON.stringify({ t: token }) })
        .then(function(j){ drawTicket(j.booking, null, 'Cancelled. The time is free again.', when, token); })
        .catch(function(e){ cb.disabled = false; cb.textContent = 'Cancel appointment'; alert(e.message); });
    });
  }
})();
</script>
</body>
</html>
