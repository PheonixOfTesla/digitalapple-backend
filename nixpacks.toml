# Render worker deps: the reel renderer drives a headless Chromium via
# playwright-core and muxes with ffmpeg. "..." keeps the default Node toolchain.
#
# playwright-core needs its OWN small ffmpeg helper to mux screen recordings
# (separate from system ffmpeg, which we use for the final encode). Install it
# into /app/pw at build time so it exists in the runtime image.
[phases.setup]
nixPkgs = ["...", "chromium", "ffmpeg"]

[phases.build]
cmds = ["PLAYWRIGHT_BROWSERS_PATH=/app/pw npx playwright-core install ffmpeg"]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/pw"
